<ng-container>
  <div class="input-group input-group-merge speech-to-text">
    <input
      type="text"
      class="form-control"
      placeholder="Say it"
      aria-describedby="text-to-speech-addon" />
    <span class="input-group-text" id="text-to-speech-addon">
      <i class="bx bx-search cursor-pointer "></i>
    </span>
  </div>
</ng-container>
